// 获取该游戏实际拥有的实机截图总数
function getGameScreenshotCount(dirName) {
  if (window.GAME_SCREENSHOTS_MANIFEST && window.GAME_SCREENSHOTS_MANIFEST[dirName]) {
    return window.GAME_SCREENSHOTS_MANIFEST[dirName];
  }
  return 10; // 默认探测 10 张
}

// 渲染画廊卡片
const gameGrid = document.getElementById("gameGrid");
const gameCount = document.getElementById("gameCount");

function renderCards(list) {
  gameGrid.innerHTML = "";
  gameCount.innerText = `当前呈现 ${list.length} 款小团队神作与标杆案例 (满额 100 款)`;

  list.forEach(game => {
    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("data-id", game.id);
    card.setAttribute("data-cat", game.category);

    const localBase = `./GameScreenshots/${game.dir}`;
    const localCover = `${localBase}/cover.jpg`;
    const ssTotal = getGameScreenshotCount(game.dir);

    const categoryNames = {
      batch1: "强烈拆机制 1~20",
      batch2: "商业优选 21~40",
      batch3: "模拟工厂 41~60",
      batch4: "怪点子爆款 61~80",
      batch5: "新作挖掘 81~100"
    };

    card.innerHTML = `
      <div class="card-banner" onclick="openLightbox(${game.id}, 0)">
        <img src="${localCover}" alt="${game.name}" loading="lazy" onerror="this.src='https://cdn.cloudflare.steamstatic.com/steam/apps/${game.id}/header.jpg'">
        <span class="batch-badge">${categoryNames[game.category]}</span>
      </div>
      <div class="card-body">
        <div class="card-header-info">
          <div class="card-title">${game.name}</div>
          <a class="steam-link" href="https://store.steampowered.com/app/${game.id}/" target="_blank" title="前往 Steam 商店">
            <span>Steam</span> ↗
          </a>
        </div>
        <div class="meta-tags">
          <span class="meta-tag highlight">${game.year}</span>
          <span class="meta-tag">${game.team}</span>
          <span class="meta-tag">${game.genre}</span>
        </div>
        <div class="mechanic-desc">
          <strong>核心机制：</strong>${game.core}
          <div style="margin-top: 4px; color: #94a3b8; font-size: 0.8rem;">${game.desc}</div>
        </div>
        <div class="screenshots-strip" id="strip-${game.id}">
          <div class="screenshot-thumb" onclick="openLightbox(${game.id}, 1)">
            <img src="${localBase}/screenshot_1.jpg" alt="Shot 1" loading="lazy" onerror="this.parentElement.style.display='none'">
          </div>
          <div class="screenshot-thumb" onclick="openLightbox(${game.id}, 2)">
            <img src="${localBase}/screenshot_2.jpg" alt="Shot 2" loading="lazy" onerror="this.parentElement.style.display='none'">
          </div>
          <div class="screenshot-thumb" onclick="openLightbox(${game.id}, 3)">
            <img src="${localBase}/screenshot_3.jpg" alt="Shot 3" loading="lazy" onerror="this.parentElement.style.display='none'">
          </div>
          <div class="screenshot-thumb" onclick="openLightbox(${game.id}, 4)">
            <img src="${localBase}/screenshot_4.jpg" alt="Shot 4" loading="lazy" onerror="this.parentElement.style.display='none'">
          </div>
          <div class="thumb-count-btn" onclick="openLightbox(${game.id}, 0)" title="查看该游戏在商店里的全部实机大图">
            +${ssTotal}张全原画
          </div>
        </div>
      </div>
    `;

    gameGrid.appendChild(card);
  });
}

// 筛选逻辑
let currentCategory = "all";
let currentSearch = "";

function applyFilters() {
  const filtered = gamesData.filter(game => {
    const matchCat = currentCategory === "all" || game.category === currentCategory;
    const matchSearch = currentSearch === "" || 
      game.name.toLowerCase().includes(currentSearch) ||
      game.genre.toLowerCase().includes(currentSearch) ||
      game.core.toLowerCase().includes(currentSearch) ||
      game.desc.toLowerCase().includes(currentSearch);
    return matchCat && matchSearch;
  });
  renderCards(filtered);
}

// 标签切换
const filterTabs = document.querySelectorAll(".filter-tab");
filterTabs.forEach(tab => {
  tab.addEventListener("click", () => {
    filterTabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentCategory = tab.getAttribute("data-category");
    applyFilters();
  });
});

// 实时搜索
document.getElementById("searchInput").addEventListener("input", (e) => {
  currentSearch = e.target.value.trim().toLowerCase();
  applyFilters();
});

// 全屏 Lightbox 画廊控制 (动态加载该游戏拥有的全部大图)
const lb = document.getElementById("lightbox");
const lbTitle = document.getElementById("lbGameTitle");
const lbDesc = document.getElementById("lbGameDesc");
const lbMainImg = document.getElementById("lbMainImage");
const lbThumbs = document.getElementById("lbThumbs");
const lbCounter = document.getElementById("lbCounter");
let currentLbAppId = null;
let currentLbIndex = 0;
let currentLbImages = [];

function openLightbox(appid, initialIndex = 0) {
  const game = gamesData.find(g => g.id === appid);
  if (!game) return;

  currentLbAppId = appid;
  currentLbIndex = initialIndex;
  lbTitle.innerText = `${game.name} (${game.year} | ${game.team})`;
  lbDesc.innerHTML = `<span style="color: #38bdf8;">[${game.genre}]</span> 核心机制：${game.core} —— ${game.desc}`;

  const localBase = `./GameScreenshots/${game.dir}`;
  const totalScreenshots = getGameScreenshotCount(game.dir);

  // 动态组装该游戏所有的截图 (无上限)
  currentLbImages = [`${localBase}/cover.jpg`];
  for (let i = 1; i <= Math.max(totalScreenshots, 15); i++) {
    currentLbImages.push(`${localBase}/screenshot_${i}.jpg`);
  }

  renderLightboxView();
  lb.classList.add("active");
}

function renderLightboxView() {
  if (currentLbImages.length === 0) return;
  if (currentLbIndex < 0) currentLbIndex = currentLbImages.length - 1;
  if (currentLbIndex >= currentLbImages.length) currentLbIndex = 0;

  const currentSrc = currentLbImages[currentLbIndex];
  lbMainImg.src = currentSrc;
  lbCounter.innerText = `${currentLbIndex + 1} / ${currentLbImages.length}`;

  lbThumbs.innerHTML = currentLbImages.map((src, idx) => `
    <div class="lb-thumb ${idx === currentLbIndex ? 'active' : ''}" onclick="selectLbImage(${idx})">
      <img src="${src}" alt="Thumb" loading="lazy" onerror="this.parentElement.style.display='none'">
    </div>
  `).join("");
}

function selectLbImage(idx) {
  currentLbIndex = idx;
  renderLightboxView();
}

document.getElementById("lbPrev").addEventListener("click", () => {
  currentLbIndex--;
  renderLightboxView();
});

document.getElementById("lbNext").addEventListener("click", () => {
  currentLbIndex++;
  renderLightboxView();
});

document.getElementById("lbClose").addEventListener("click", () => {
  lb.classList.remove("active");
});

window.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("active")) return;
  if (e.key === "Escape") lb.classList.remove("active");
  if (e.key === "ArrowLeft") { currentLbIndex--; renderLightboxView(); }
  if (e.key === "ArrowRight") { currentLbIndex++; renderLightboxView(); }
});

// 初始化
renderCards(gamesData);
</script>
